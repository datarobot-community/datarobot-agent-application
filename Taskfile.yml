---
# File generated by DataRobot CLI, regenerate using `dr task compose`
version: '3'
env:
  ENV: testing
  PYTHONWARNINGS: "ignore"
dotenv: ['.env', '.env.{{.ENV}}']
vars:
  AGENT_VERSION:
    sh: |
      uv run --no-project python -c "
      import re, pathlib
      p = pathlib.Path('.datarobot/answers/agent-agent.yml')
      m = re.search(r'_commit:\s*(\S+)', p.read_text() if p.exists() else '')
      print(m[1] if m else '')
      "

includes:
  common:
    taskfile: ./core/task-common.yaml
    internal: true
  agent:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  core:
    taskfile: ./core/Taskfile.yaml
    dir: ./core
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  fastapi_server:
    taskfile: ./fastapi_server/Taskfile.yaml
    dir: ./fastapi_server
  frontend_web:
    taskfile: ./frontend_web/Taskfile.yaml
    dir: ./frontend_web
  infra:
    taskfile: ./infra/Taskfile.yaml
    dir: ./infra
  mcp_server:
    taskfile: ./mcp_server/Taskfile.yaml
    dir: ./mcp_server

tasks:
  default:
    desc: "ℹ️ Show all available tasks (run `task --list-all` to see hidden tasks)"
    silent: true
    cmds:
      - task --list --sort none

  start-non-interactive:
    cmds:
      - task: start
        vars:
          COPIER_FLAGS: "-l"

  start:
    desc: "💻 Prepare local development environment"
    cmds:
      - dr self update
      - "echo '✨ Choose your agentic framework.'"
      - task: rewrite-answers-urls
      - |
        PYTHONWARNINGS=ignore uvx copier recopy -a .datarobot/answers/agent-agent.yml \
        -r {{.AGENT_VERSION}} \
        --data base_answers_file=.datarobot/answers/base.yml \
        --data agent_app_name=agent \
        --data agent_development_port=8842 \
        --data include_taskfile_infra=no \
        --data mcp_answers_file=.datarobot/answers/drmcp-mcp_server.yml \
        --data llm_answers_file=.datarobot/answers/llm-llm.yml \
        {{.COPIER_FLAGS}} -w --quiet
      - task build-agents-md
      - dr task compose
      - dr dotenv setup --if-needed
      - dr dotenv update
      - task install
      - dr task run start
      - echo '✅ You are all set. Run `task dev` to start developing, or run `task deploy` to deploy to DataRobot.'

  # https://github.com/datarobot-oss/cli/pull/722 replace with dr component rewrite-config if merged
  rewrite-answers-urls:
    internal: true
    cmds:
      - |
        uv run --no-project python -c "
        import os, pathlib
        base_url = os.environ.get('APPLICATION_TEMPLATE_GIT_BASE_URL')
        if base_url:
            base_url = base_url.rstrip('/')
            for p in pathlib.Path('.datarobot/answers').glob('*.yml'):
                text = p.read_text()
                p.write_text(text.replace('https://github.com/datarobot-community', base_url))
        "

  build-agents-md:
    cmds:
      - cmd: |
          cp AGENTS.md.template AGENTS.md
          [ -f agent/AGENTS.md ] && cat agent/AGENTS.md >> AGENTS.md
          [ -f mcp_server/AGENTS.md ] && cat mcp_server/AGENTS.md >> AGENTS.md
          [ -f fastapi_server/AGENTS.md ] && cat fastapi_server/AGENTS.md >> AGENTS.md
          [ -f frontend_web/AGENTS.md ] && cat frontend_web/AGENTS.md >> AGENTS.md
          [ -f infra/AGENTS.md ] && cat infra/AGENTS.md >> AGENTS.md
          true
        platforms: [linux, darwin]
      - cmd: powershell -Command "Copy-Item 'AGENTS.md.template' 'AGENTS.md'; if (Test-Path 'agent\AGENTS.md') { Get-Content
          'agent\AGENTS.md' | Add-Content 'AGENTS.md' }; if (Test-Path 'mcp_server\AGENTS.md') { Get-Content 'mcp_server\AGENTS.md'
          | Add-Content 'AGENTS.md' }; if (Test-Path 'fastapi_server\AGENTS.md') { Get-Content 'fastapi_server\AGENTS.md'
          | Add-Content 'AGENTS.md' }; if (Test-Path 'frontend_web\AGENTS.md') { Get-Content 'frontend_web\AGENTS.md' | Add-Content
          'AGENTS.md' }; if (Test-Path 'infra\AGENTS.md') { Get-Content 'infra\AGENTS.md' | Add-Content 'AGENTS.md' }"
        platforms: [windows]
  lint:
    desc: "🧹 Run linters"
    cmds:
      - dr task run lint
  install:
    desc: "🛠️ Install all dependencies"
    cmds:
      - |
        if command -v drdev >/dev/null 2>&1; then
          echo "drdev already installed, skipping datarobot[core] install"
        elif [ -n "$VIRTUAL_ENV" ]; then
          echo "Installing datarobot[core] into active virtualenv: $VIRTUAL_ENV"
          uv pip install "datarobot[core]>=3.18.0"
        else
          uv tool update-shell
          echo "Installing datarobot[core] as a uv tool"
          uv tool install --force "datarobot[core]>=3.18.0"
        fi
      - dr task run install
  test:
    desc: "🧪 Run tests across all components"
    cmds:
      - dr task run test

  auth-check:
    silent: true
    desc: "🔐 Check authentication prerequisites"
    cmds:
      - echo "🔐 Checking authentication.."
      - dr auth check

  dev:
    desc: "🚀 Run all services together"
    deps:
      - auth-check
    cmds:
      - drdev

  deploy:
    desc: "🚀 Deploy all services"
    env:
      AGENT_DEPLOY: "1"
    deps:
      - install
    cmds:
      - task: infra:deploy

  deploy-dev:
    desc: "🚀 Deploy infrastructure and services to development"
    deps:
      - install
    cmds:
      - task: infra:deploy-dev
