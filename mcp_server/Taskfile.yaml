---
# https://taskfile.dev
version: '3'

includes:
  common:
    taskfile: ../core/task-common.yaml
    internal: true

vars:
  MCP_DEPLOYMENT_TYPE_RESOLVED:
    sh: |
      # Lower-cased to match the pulumi-side validation, which lowercases the
      # value before checking it — both ends must accept the same spellings.
      # 1) OS env (includes the root dotenv when invoked via the repo root's task wrapper)
      if [ -n "${MCP_DEPLOYMENT_TYPE:-}" ]; then
        echo "$MCP_DEPLOYMENT_TYPE" | tr '[:upper:]' '[:lower:]' | xargs
        exit 0
      fi
      # 2) Fallback for standalone `task install` runs from this app directory
      for env_file in ../.env "../.env.${ENV:-testing}" .env; do
        if [ -f "$env_file" ]; then
          line="$(grep -E '^[[:space:]]*MCP_DEPLOYMENT_TYPE=' "$env_file" | tail -n 1 || true)"
          if [ -n "$line" ]; then
            val="${line#MCP_DEPLOYMENT_TYPE=}"
            val="${val%\"}"; val="${val#\"}"
            val="${val%\'}"; val="${val#\'}"
            echo "$val" | tr '[:upper:]' '[:lower:]' | xargs
            exit 0
          fi
        fi
      done
      echo ""

tasks:
  load-and-save-mcp-item-metadata:
    desc: "Load and save MCP item metadata"
    cmds:
      - echo "🔧 Loading and saving MCP item metadata.."
      - "{{.UV_CMD}} run dev_tools/lineage/cli.py load-and-save-mcp-item-metadata"

  deployment-type-check:
    desc: "ℹ️ Validate MCP_DEPLOYMENT_TYPE and print the effective MCP deployment mode"
    silent: true
    vars:
      RAW_MCP_DEPLOYMENT_TYPE: '{{.MCP_DEPLOYMENT_TYPE_RESOLVED}}'
    cmds:
      - |
        case "{{.RAW_MCP_DEPLOYMENT_TYPE}}" in
          datarobot-serverless|datarobot-workload-preview)
            echo "✅ MCP deployment type is set up as MCP_DEPLOYMENT_TYPE={{.RAW_MCP_DEPLOYMENT_TYPE}}"
            ;;
          "")
            echo "⚠️  MCP_DEPLOYMENT_TYPE is not set; deploy will default to MCP_DEPLOYMENT_TYPE=datarobot-serverless."
            echo "ℹ️  To choose explicitly, set in .env or your shell:"
            echo "       MCP_DEPLOYMENT_TYPE=datarobot-serverless"
            echo "    or MCP_DEPLOYMENT_TYPE=datarobot-workload-preview"
            ;;
          *)
            echo "❌  Invalid MCP_DEPLOYMENT_TYPE '{{.RAW_MCP_DEPLOYMENT_TYPE}}'."
            echo "ℹ️  Set a valid value in .env or your shell:"
            echo "       MCP_DEPLOYMENT_TYPE=datarobot-serverless"
            echo "    or MCP_DEPLOYMENT_TYPE=datarobot-workload-preview"
            exit 1
            ;;
        esac

  install:
    desc: "🔧 Install dependencies"
    vars:
      EFFECTIVE_DEPLOYMENT_TYPE: '{{.MCP_DEPLOYMENT_TYPE_RESOLVED | default "datarobot-serverless"}}'
    deps:
      - deployment-type-check
    cmds:
      - echo "🔧 Installing dependencies.."
      - "{{.UV_CMD}} sync --all-extras"
      # MCP item metadata is only consumed by datarobot-serverless provisioning.
      # (go-task has no `if:` on task calls, so this is a shell conditional.)
      - |
        if [ "{{.EFFECTIVE_DEPLOYMENT_TYPE}}" = "datarobot-serverless" ]; then
          echo "🔧 Loading and saving MCP item metadata.."
          {{.UV_CMD}} run dev_tools/lineage/cli.py load-and-save-mcp-item-metadata
        fi
    silent: true

  dev:
    desc: "🔨 Running MCP locally"
    cmds:
      - echo "🔨 Starting development server"
      - task: install
      - |
        (cd .. && dr --skip-plugin-update-check xp --plain-output) &
        DR_XP_PID=$!
        trap "kill $DR_XP_PID 2>/dev/null || true" EXIT
        {{.UV_CMD}} run app/main.py
    silent: true

  dev-background:
    desc: "🔨 Running MCP locally in background"
    vars:
      PORT: 8082
    cmds:
      - echo "🔨 Starting development server"
      - echo "MCP Server running on port {{.PORT}}"
      # Kill any existing process on the port
      - echo "Killing existing process on port {{.PORT}}"
      - lsof -i :{{.PORT}} > /dev/null 2>&1 && echo "Killing existing process on port {{.PORT}}" && lsof -i :{{.PORT}} | grep
        LISTEN | awk '{print $2}' | xargs kill -9 2>/dev/null || true
      - task: install
      # Start server (OTEL disabled so no collector required)
      - |
        OTEL_ENABLED=false \
        OTEL_ATTRIBUTES='{"environment":"test","service.instance.id":"ete-tests"}' \
        OTEL_COLLECTOR_BASE_URL=http://localhost:4318 \
        OTEL_ENTITY_ID=deployment-68924b8b51102f055bef861c \
        MCP_SERVER_PORT={{.PORT}} \
        {{.UV_CMD}} run app/main.py &
      # Wait for server to be ready
      - |
        for i in {1..30}; do
          if curl -s http://localhost:{{.PORT}}/ > /dev/null 2>&1; then
            echo "Server is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start"
            exit 1
          fi
          sleep 1
        done
    silent: true

  dev-otel-background:
    desc: "🔨 Running DR MCP Library locally in background with OTEL"
    cmds:
      - echo "🔨 Ensuring Jaeger (OTEL) is running"
      - |
        if ! command -v docker >/dev/null 2>&1 || ! docker info >/dev/null 2>&1; then
          echo "Docker isn't running, skipping OTEL startup"
          exit 0
        fi
        if docker ps -q --filter name=jaeger --filter status=running | grep -q .; then
          echo "Jaeger already running, using existing container"
          exit 0
        fi
        if docker ps -aq --filter name=jaeger | grep -q .; then
          echo "Starting existing Jaeger container"
          docker start jaeger >/dev/null 2>&1 || true
        else
          echo "Launching new Jaeger container"
          docker run -d --name jaeger -p 16686:16686 -p 4318:4318 -e COLLECTOR_OTLP_ENABLED=true jaegertracing/all-in-one:1.54 >/dev/null 2>&1 || true
        fi
    silent: true

  lint:
    desc: "🧹 Run linters"
    cmds:
      - echo "🧹 Running linters.."
      - "{{.UV_CMD}} sync --all-extras"
      - "{{.UV_CMD}} run ruff format ."
      - "{{.UV_CMD}} run ruff check . --fix"
      - "{{.UV_CMD}} run mypy --pretty --exclude 'app/tests' ."
    silent: true

  lint-check:
    desc: "🧹 Check whether the codebase is linted"
    cmds:
      - "{{.UV_CMD}} sync --all-extras"
      - "{{.UV_CMD}} run ruff format --check ."
      - "{{.UV_CMD}} run ruff check ."
      - "{{.UV_CMD}} run mypy --pretty --exclude 'app/tests' ."
    silent: true

  test:
    desc: "🧪 Run tests"
    cmds:
      - rm -rf .coverage .coverage.xml htmlcov
      - echo "🧪 Running all tests.."
      - task unit
    silent: true

  copyright:
    aliases: [license]
    desc: 📜 Apply license headers
    cmds:
      - echo "📜 Applying license headers"
      - >-
        docker run  --rm -v $PWD:/github/workspace ghcr.io/apache/skywalking-eyes/license-eye:eb0e0b091ea41213f712f622797e37526ca1e5d6
        -v info -c .licenserc.yaml header fix

  copyright-check:
    aliases: [license-check]
    desc: 📜 Checking for license headers
    cmds:
      - echo "📜 Checking license headers"
      - >-
        docker run  --rm -v $PWD:/github/workspace ghcr.io/apache/skywalking-eyes/license-eye:eb0e0b091ea41213f712f622797e37526ca1e5d6
        -v info -c .licenserc.yaml header check

  ete:
    desc: "Run ETE tests"
    cmds:
      # Start jaeger in background
      - task: dev-otel-background
      # Start server with default port 8082
      - task: dev-background
      # Set up cleanup to run on exit
      - defer: |
          echo "Stopping MCP Server"
          lsof -i :8082 | grep LISTEN | awk '{print $2}' | xargs kill -9 2>/dev/null || true
          echo "Stopping Jaeger"
          docker stop jaeger || true
      # Run tests
      - echo "Running ETE tests"
      - >-
        DR_MCP_SERVER_URL=http://localhost:8082/mcp/ {{.UV_CMD}} run pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}app/tests/ete/{{end}}
        -s -vv
    silent: true

  integration:
    desc: "Run integration tests"
    cmds:
      - echo "Running integration tests"
      - >-
        {{.UV_CMD}} sync --all-extras && {{.UV_CMD}} run pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}app/tests/integration/{{end}}
        -s -vv
    silent: true

  unit:
    desc: "Run unit tests"
    vars:
      TEST_PATH: app/tests/unit/ tests/units/
    cmds:
      - rm -rf .coverage .coverage.xml htmlcov
      - echo "Running unit tests"
      - >-
        {{.UV_CMD}} sync --all-extras && {{.UV_CMD}} run pytest {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{.TEST_PATH}}{{end}}
        --cov=app --cov-report=xml --cov-report=html --cov-report=term-missing -s -vv
    silent: true

  test-interactive:
    desc: "🧪 Run interactive MCP client test"
    vars:
      PORT: 8082
    cmds:
      # Set up cleanup to run on exit
      - defer: |
          echo "Stopping MCP Server"
          lsof -i :{{.PORT}} | grep LISTEN | awk '{print $2}' | xargs kill -9 2>/dev/null || true
          echo "Stopping Jaeger"
          docker stop jaeger || true
      - echo "🧪 Starting interactive MCP client test"
      - |
        if [ -z "$DR_MCP_SERVER_URL" ]; then
          echo "DR_MCP_SERVER_URL is not set, setting it to http://localhost:{{.PORT}}/mcp/"
          export DR_MCP_SERVER_URL=http://localhost:{{.PORT}}/mcp/
        fi
        if [ "$DR_MCP_SERVER_URL" = "http://localhost:{{.PORT}}/mcp/" ]; then
          echo "DR_MCP_SERVER_URL is set to http://localhost:{{.PORT}}/mcp/, starting server in background"
          task dev-background
        fi
        echo ""
        {{.UV_CMD}} run python test_interactive.py
    silent: true

  release_files:
    desc: "🔨 Make sure to move these files to the root of the repository before a release"
    cmds:
      - >-
        echo "mkdir -p ./docs ./img && mv ./dr_mcp/docs/* ./docs/ && mv ./dr_mcp/img/* ./img/ && mv ./dr_mcp/.env.template
        ./.env.template && mv ./dr_mcp/README.md ./README.md"
    silent: true
