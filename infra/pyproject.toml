[project]
name = "infra"
version = "0.0.1"
description = """
This application is a template for Generative AI agentic solutions
"""
requires-python = ">=3.11, <3.14"

dependencies = [
    "datarobot>=3.8.2",
    "datarobot-pulumi-utils>=0.1.6",
    "litellm>=1.72.1,<2.0.0,!=1.82.7,!=1.82.8",
    "pulumi>=3.175.0",
    "pulumi-datarobot>=0.10.43",
    "jinja2>=3.1.5,<4.0",
    "pulumi-command>=1.1.3",
    "ipdb>=0.13.13",
    "rpdb>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=6.1.1",
    "pytest>=7.4.0",
    "ruff>=0.16.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
exclude = "configurations"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infra", "dev_tools"]
