---
root:
  - env: MCP_SERVER_PORT
    type: string
    default: "9000"
    optional: true
    help: "The local port to access the MCP Server. Should have a unique port."
  - env: SESSION_SECRET_KEY
    type: secret_string
    generate: true
    optional: false
    help: |
      Enter a secret key used to sign session cookies. This should be a long, random string.
      The default value is randomly generated if the secret key is not already configured.
  - env: DATAROBOT_DEFAULT_MCP_EXECUTION_ENVIRONMENT
    type: string
    default: "[DataRobot] Python 3.11 GenAI Agents"
    optional: true
    help: "Enter the default execution environment for the MCP server."
  - env: DATAROBOT_DEFAULT_MCP_EXECUTION_ENVIRONMENT_VERSION_ID
    type: string
    default: "6a5a69d3cd08a31cc2fe625f"
    optional: true
    help: "Enter the default execution environment version ID for the MCP server."
  - key: enabled_tools
    env: MCP_CLI_CONFIGS
    multiple: true
    help: "Select which tool integrations and features to enable (space to toggle, enter to confirm)."
    default: ""
    optional: true
    always_prompt: true
    options:
      - name: "Enable Predictive tools"
        value: "predictive"
      - name: "Enable Google Drive (requires Google OAuth)"
        value: "gdrive"
      - name: "Enable Microsoft Graph tools (requires Microsoft OAuth)"
        value: "microsoft_graph"
      - name: "Enable Jira tools (requires OAuth)"
        value: "jira"
      - name: "Enable Confluence tools (requires OAuth)"
        value: "confluence"
      - name: "Enable Perplexity tools (requires Perplexity API key)"
        value: "perplexity"
      - name: "Enable Tavily tools (requires Tavily API key)"
        value: "tavily"
      - name: "Register DataRobot dynamic tools on startup"
        value: "dynamic_tools"
      - name: "Register DataRobot dynamic prompts on startup"
        value: "dynamic_prompts"
      - name: "Configure tool credentials via environment variables"
        value: "config_auth"
        requires: auth_config

auth_config:
  - env: AUTH_RESOLUTION_STRATEGY
    help: |
      Config mode supports API-key and token-based tools only.
      OAuth 2 tools (Google Drive, Microsoft Graph) are not supported in config mode;
      use HTTP auth (default) for OAuth-based integrations instead.
      Use config mode only for a personal agent that is not shared with other users;
      otherwise everyone will use tools with the owner's API keys.
    optional: true
    default: "config"
  - env: PERPLEXITY_API_KEY
    type: secret_string
    optional: true
    help: |
      Perplexity API key. Required only if Perplexity tools are enabled above.
  - env: TAVILY_API_KEY
    type: secret_string
    optional: true
    help: |
      Tavily API key. Required only if Tavily tools are enabled above.
  - key: configure_atlassian_tools
    help: |
      Configure Atlassian credentials for Jira/Confluence tools.
      Select Configure only if you enabled Jira or Confluence above.
    always_prompt: true
    optional: true
    options:
      - name: "Configure Atlassian credentials"
        value: "yes"
        requires: atlassian_tools

atlassian_tools:
  - env: ATLASSIAN_API_TOKEN
    type: secret_string
    optional: false
    help: |
      Atlassian API token for Jira/Confluence tools (OAuth access token or personal API token).
  - env: ATLASSIAN_EMAIL
    type: string
    optional: false
    help: |
      Atlassian account email for API token authentication (HTTP Basic auth).
  - env: ATLASSIAN_SITE_URL
    type: string
    optional: false
    help: |
      Atlassian site URL for API token authentication (e.g. https://your-org.atlassian.net).
